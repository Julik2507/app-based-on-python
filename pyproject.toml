[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diary-cli"
version = "0.1.0"
description = "Command-line diary utility"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "SQLAlchemy>=2.0",
]

[project.scripts]
diary = "attestation_1.diary:cli"

[tool.setuptools.packages.find]
include = ["attestation_1*"]
